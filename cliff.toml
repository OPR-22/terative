# git-cliff configuration.
#
# Generates CHANGELOG.md and computes the next semver version from
# Conventional Commits. Invoked by .github/workflows/release.yml.
#
# Pre-1.0 bump policy: `feat:` bumps minor (0.1 -> 0.2), `BREAKING` also bumps
# minor (the "anything goes" pre-1.0 convention). After 1.0, BREAKING jumps to
# major automatically per semver.

[changelog]
header = """
# Changelog

All notable changes to this project will be documented in this file.

The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.1.0/),
and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).

"""

body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## [unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | upper_first }}
{% for commit in commits %}\
- {{ commit.message | upper_first }}{% if commit.breaking %} [**breaking**]{% endif %}
{%- endfor %}
{% endfor %}\n
"""

footer = ""
trim = true

[git]
conventional_commits = true
# Drop non-conventional commits entirely. The local commit-msg hook keeps these
# out of the repo, but this is a belt-and-suspenders safeguard.
filter_unconventional = true
split_commits = false
tag_pattern = "v[0-9].*"
commit_parsers = [
    { message = "^feat",     group = "Features" },
    { message = "^fix",      group = "Bug Fixes" },
    { message = "^perf",     group = "Performance" },
    { message = "^refactor", group = "Refactors" },
    { message = "^docs",     group = "Docs",   skip = true },
    { message = "^chore",    group = "Chores", skip = true },
    { message = "^ci",       group = "CI",     skip = true },
    { message = "^build",    group = "Build",  skip = true },
    { message = "^test",     group = "Tests",  skip = true },
    { message = "^style",    group = "Style",  skip = true },
]

[bump]
features_always_bump_minor = true
breaking_always_bump_major = false
