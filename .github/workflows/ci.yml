name: ci

# Split by what each job does:
#   build  — does the whole app compile? (frontend bundle + full Rust release)
#   test   — do the tests pass?           (cargo test, frontend tests, drift check)
#
# Both run on every PR and every push to main. Neither produces installers —
# that's release.yml's job. Skipping the bundling step keeps CI fast and
# means no signing key is needed in regular CI runs.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Cancel an in-flight CI run if the same branch is pushed again. Saves runner
# minutes when force-pushing fixups to a PR.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Builds the whole Tauri app end-to-end EXCEPT installer packaging:
    #   1. pnpm install                                       (deps)
    #   2. pnpm build         (via tauri.conf.json's          (frontend bundle)
    #      beforeBuildCommand, invoked by `tauri build`)
    #   3. cargo build --release on the Rust backend          (release codegen)
    #   4. SKIPPED: bundling into .dmg/.AppImage/.exe/.msi     (release.yml does this)
    #   5. SKIPPED: code signing + updater .sig generation     (no key in CI)
    #
    # This catches everything `cargo check` misses (link errors, build-script
    # failures, bundle config typos) without paying for installer packaging
    # on every PR.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install Linux system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      # --ignore-scripts skips husky's `prepare` hook setup. CI doesn't commit,
      # so git hooks aren't useful here.
      - run: pnpm install --frozen-lockfile --ignore-scripts

      # The actual build. `--no-bundle` is the speed lever: everything compiles
      # but no .app/.dmg/.AppImage/.deb/.exe/.msi is produced and no signing
      # runs. If this fails, the app does not build — bisect from here.
      - name: Build (no installer bundling)
        run: pnpm tauri build --no-bundle

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install Linux system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - run: pnpm install --frozen-lockfile --ignore-scripts

      # Rust unit/integration tests. Includes the specta bindings export test
      # in src-tauri/src/lib.rs which rewrites src/ipc/bindings.ts. The drift
      # check below catches PRs that changed the IPC contract without
      # committing the regenerated bindings.
      - name: cargo test
        working-directory: src-tauri
        run: cargo test --locked

      - name: Confirm specta TS bindings are checked in and current
        run: git diff --exit-code -- src/ipc/bindings.ts

      # Frontend tests — vitest, configured via vitest.config.ts. Picks up
      # every `src/**/*.{test,spec}.{ts,tsx}` file automatically.
      - name: pnpm test
        run: pnpm test
