[package]
name = "terative"
version = "0.1.0"
description = "Terative — local-first invoicing and accounting"
authors = ["Terative"]
edition = "2021"

[lib]
name = "terative_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled", "chrono"] }
rusqlite_migration = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
rust_decimal = { version = "1", features = ["serde"] }
rust_decimal_macros = "1"
thiserror = "1"
anyhow = "1"
parking_lot = "0.12"
directories = "5"
typst = "0.14"
typst-pdf = "0.14"
typst-as-lib = { version = "0.15", features = ["typst-kit-fonts", "typst-kit-embed-fonts"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "linux-native"] }
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "native-tls", "builder"] }

[dev-dependencies]
tempfile = "3"
