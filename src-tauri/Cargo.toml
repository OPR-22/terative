[package]
name = "terative"
version = "0.1.0"
description = "Terative — local-first invoicing and accounting"
authors = ["Terative"]
edition = "2021"

[lib]
name = "terative_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["unstable"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled-sqlcipher-vendored-openssl", "chrono"] }
rusqlite_migration = "1"
uuid = { version = "1", features = ["v4", "v5", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
rust_decimal = { version = "1", features = ["serde"] }
rust_decimal_macros = "1"
thiserror = "1"
anyhow = "1"
parking_lot = "0.12"
directories = "5"
typst = "0.14"
typst-pdf = "0.14"
typst-as-lib = { version = "0.15", features = ["typst-kit-fonts", "typst-kit-embed-fonts"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "linux-native"] }
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "native-tls", "builder"] }
specta = { version = "=2.0.0-rc.24", features = ["derive", "chrono", "uuid", "rust_decimal"] }
specta-typescript = "0.0.11"
tauri-specta = { version = "=2.0.0-rc.24", features = ["derive", "typescript"] }
url = "2"
fake = { version = "2", features = ["chrono"] }
rand = "0.8"
slug = "0.1"
arc-swap = "1"
zeroize = "1"
downcast-rs = "1.2"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"

[dev-dependencies]
tempfile = "3"

# Release profile: smaller, faster binaries for distributed builds. `tauri-action`
# always compiles `--release`; these knobs further trim size and improve runtime
# at the cost of longer compile times — fine for CI, irrelevant for `tauri dev`.
[profile.release]
opt-level = "s"      # size-optimized; desktop app, not hot-loop heavy
lto = true
codegen-units = 1
strip = true
